[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "flythings-dataspace-sdk"
version = "1.1.0-alpha"
description = "SDK for interacting with the Flythings Dataspace Connector"
authors = [
    { name="Daniel Silva Iglesias", email="dsilva@itg.es" },
    { name="Datos Indaga", email="indaga@itg.es" }
]
readme = "README.md"
requires-python = ">=3.9"
keywords = ["api", "client", "sdk"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = {text = "MIT"}

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[project.urls]
Homepage = "https://github.com/datosindaga"
Repository = "https://github.com/datosindaga/py-indaga-connector-sdk"
Issues = "https://github.com/datosindaga/py-indaga-connector-sdk/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
