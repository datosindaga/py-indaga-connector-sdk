[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "connector_sdk"
version = "1.0.0"
description = "SDK for interacting with the Flythings Dataspace Connector"
authors = [
    { name="Daniel Silva Iglesias", email="dsilva@itg.es" }
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = {text = "MIT"}

dependencies = [
    "httpx>=0.27"
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
